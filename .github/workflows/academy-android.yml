name: Academy Android build
on:
  push:
    branches: [home-improvements-oct29]
    paths: ['academy-app/**', 'mobile/academy/**', '.github/workflows/academy-android.yml']
  pull_request:
    paths: ['academy-app/**', 'mobile/academy/**', '.github/workflows/academy-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare offline Android app
        working-directory: mobile/academy
        run: |
          npm ci --no-audit --no-fund
          npm run sync
      - name: Compile debug APK
        working-directory: mobile/academy/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Walamort-Academy-Android-debug
          path: mobile/academy/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
